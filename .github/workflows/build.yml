name: Build

# builds/ klasorunu master'a geri yazmak icerik YAZMA izni ister.
# Kontrol: Settings -> Actions -> General -> Workflow permissions ->
# "Read and write permissions" secili olmali. (Bu repo bir fork; bu ayar
# kapaliysa push 403 ile reddedilir.)
permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"
      # CI'in kendi urettigi builds/ klasoru master'a push'landiginda
      # workflow'u tekrar tetiklemesin (sonsuz dongu onlemi).
      - "builds/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Preserve Ninjago release and clean old builds
        run: |
          # NinjagoIzlesene is intentionally frozen. Save its published binary and
          # repository metadata before rebuilding the other plugins. On the very
          # first run the builds/ folder does not exist yet; that is fine.
          preserve_dir="$RUNNER_TEMP/ninjago-preserve"
          mkdir -p "$preserve_dir"
          if [ -f "$GITHUB_WORKSPACE/builds/NinjagoIzlesene.cs3" ]; then
            cp "$GITHUB_WORKSPACE/builds/NinjagoIzlesene.cs3" "$preserve_dir/NinjagoIzlesene.cs3"
            echo "NINJAGO_PRESERVED=true" >> "$GITHUB_ENV"
          fi
          if [ -f "$GITHUB_WORKSPACE/builds/plugins.json" ]; then
            cp "$GITHUB_WORKSPACE/builds/plugins.json" "$preserve_dir/plugins.json"
          fi
          rm -rf "$GITHUB_WORKSPACE/builds"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build Plugins
        run: gradle make makePluginsJson --stacktrace

      - name: Collect builds and keep Ninjago unchanged
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds"
          find . -path '*/build/*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

          # Ilk kosu disinda: yayinlanmis Ninjago paketinin birebir ayni
          # baytlarini geri koy, registry kaydini da eskiyle esitle.
          if [ "${NINJAGO_PRESERVED}" = "true" ]; then
            preserve_dir="$RUNNER_TEMP/ninjago-preserve"
            cp "$preserve_dir/NinjagoIzlesene.cs3" "$GITHUB_WORKSPACE/builds/NinjagoIzlesene.cs3"

            python3 - "$preserve_dir/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as file:
              original = json.load(file)
          with open(sys.argv[2], "r", encoding="utf-8") as file:
              rebuilt = json.load(file)

          original_ninjago = next(
              (entry for entry in original if entry.get("internalName") == "NinjagoIzlesene"),
              None,
          )
          if original_ninjago is None:
              raise SystemExit("Refusing to publish: previous NinjagoIzlesene registry entry is missing")

          # Donmus kayit eski (bozuk) URL semasiyla kaydedilmis olabilir;
          # ikili builds/ altinda oldugu icin URL'nin de oyle uretildiginden
          # emin ol. fileHash/binary degismez.
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          if repository:
              original_ninjago["url"] = (
                  "https://raw.githubusercontent.com/"
                  + repository
                  + "/master/builds/NinjagoIzlesene.cs3"
              )

          found = False
          for index, entry in enumerate(rebuilt):
              if entry.get("internalName") == "NinjagoIzlesene":
                  rebuilt[index] = original_ninjago
                  found = True
                  break

          if not found:
              raise SystemExit("Refusing to publish: rebuilt registry has no NinjagoIzlesene entry")

          with open(sys.argv[2], "w", encoding="utf-8") as file:
              json.dump(rebuilt, file, ensure_ascii=False, indent=4)
              file.write("\n")
          PY
          fi

      - name: Push builds
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add builds

          if git diff --cached --quiet; then
            echo "Yeni derleme cikmadi, push atlaniyor."
            exit 0
          fi

          git commit -m "Build $GITHUB_SHA"

          # ASIL HATA BURADAYDI: CI calisirken web arayuzunden master'a yeni
          # commit yuklenirse (or. hizli "Add files via upload" dizisi) duz
          # push 'fetch first / non-fast-forward' reddi alir ve 1 sn icinde
          # duser. Cozum: once uzaktaki en son commit'i rebase'le, sonra
          # push'la. builds/ ciktilari genelde catismasiz rebase olur.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "::warning::Rebase basarisiz (builds/ catismasi?), 5 sn sonra tekrar ($attempt/3)."
              sleep 5
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "builds/ basariyla pushlandi (deneme $attempt/3)."
              exit 0
            fi
            echo "::warning::Push reddedildi, 5 sn sonra yeniden denenecek ($attempt/3)."
            sleep 5
          done
          echo "::error::Push 3 denemede de basarisiz. 'Push builds' adiminin logundaki git hata satirini kontrol et."
          exit 1
