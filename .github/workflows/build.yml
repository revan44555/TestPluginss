name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v6
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: |
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3
          rm -f "$GITHUB_WORKSPACE"/builds/plugins.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
          cache-provider: basic

      - name: Build Plugins
        working-directory: src
        run: |
          gradle make makePluginsJson --stacktrace

      - name: Copy builds
        run: |
          cp src/**/build/*.cs3 "$GITHUB_WORKSPACE/builds/"
          cp src/build/plugins.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        working-directory: builds
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add .

          git diff --cached --quiet || \
            git commit -m "Build $GITHUB_SHA"

          git push
